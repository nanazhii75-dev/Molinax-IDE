name: Build libmpv.so

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            abi: arm64-v8a
            triple: aarch64-linux-android
          - arch: armv7l
            abi: armeabi-v7a
            triple: arm-linux-androideabi
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkg-config libtool ninja-build \
            unzip wget gperf default-jre-headless
          pip install --user --upgrade meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify meson version
        run: meson --version

      - name: Cache SDK/NDK
        uses: actions/cache@v4
        with:
          path: native-build/sdk
          key: ndk-r29-${{ hashFiles('native-build/include/depinfo.sh') }}

      - name: Cache dependency sources
        uses: actions/cache@v4
        with:
          path: native-build/deps
          key: mpv-deps-src-${{ hashFiles('native-build/include/depinfo.sh') }}

      - name: Cache built prefix
        uses: actions/cache@v4
        with:
          path: native-build/prefix/${{ matrix.arch }}
          key: mpv-prefix-${{ matrix.arch }}-${{ hashFiles('native-build/include/depinfo.sh') }}

      - name: Download SDK/NDK + dependency sources
        working-directory: native-build
        env:
          IN_CI: "1"
        run: ./download.sh

      - name: Build libmpv for ${{ matrix.arch }}
        working-directory: native-build
        env:
          IN_CI: "1"
        run: ./buildall.sh --arch ${{ matrix.arch }} mpv

      - name: Copy libc++_shared.so from NDK sysroot
        working-directory: native-build
        run: |
          NDK_DIR="sdk/android-ndk-r29"
          SYSROOT_LIB="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.triple }}"
          cp "$SYSROOT_LIB/libc++_shared.so" "prefix/${{ matrix.arch }}/lib/"

      - name: Upload native libraries (libmpv + FFmpeg deps)
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-${{ matrix.abi }}
          path: native-build/prefix/${{ matrix.arch }}/lib/*.so
